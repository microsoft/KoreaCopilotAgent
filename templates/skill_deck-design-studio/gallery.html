<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck Design Studio: 20가지 디자인 갤러리</title>
<style>
  :root{
    --bg:#fafbfd; --bg-soft:#f3f4fb; --surface:#fff; --surface-2:#f7f8fc;
    --border:#e6e8ef; --border-strong:#d7dae3; --text:#1a1f36; --text-soft:#4a5168;
    --text-dim:#6b7280; --muted:#9aa1b0; --blue:#2563ff; --blue-2:#00b3ff; --purple:#8b5cff;
    --radius:16px; --shadow:0 8px 30px rgba(26,31,54,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Malgun Gothic','Segoe UI',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px}

  header.hero{background:linear-gradient(120deg,#0b1230,#23204e 55%,#3a2c8f);color:#fff;padding:46px 0 40px;position:relative;overflow:hidden}
  header.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;
    background:linear-gradient(135deg,#00b3ff,#8b5cff,#ff6bb5,#ff8a3d);opacity:.4;filter:blur(8px)}
  .back{font-size:13px;color:#bcc6f0;font-weight:600}
  .hero h1{font-size:30px;font-weight:800;margin:10px 0 8px;letter-spacing:-.4px}
  .hero p{color:#dfe4fa;font-size:15px;max-width:680px}
  .ribbon{height:5px;width:130px;border-radius:3px;margin-top:16px;background:linear-gradient(90deg,#00b3ff,#8b5cff,#ff6bb5,#ff8a3d)}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:26px 0 18px}
  .chip{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-soft);
    padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s}
  .chip.active{background:var(--text);color:#fff;border-color:var(--text)}
  .count{margin-left:auto;color:var(--muted);font-size:13px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;padding-bottom:60px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;transition:.18s;box-shadow:0 1px 2px rgba(26,31,54,.04)}
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--border-strong)}
  .thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--surface-2);border-bottom:1px solid var(--border)}
  .cbody{padding:14px 16px 16px}
  .cnum{font-size:12px;font-weight:800;letter-spacing:1.5px;color:var(--blue)}
  .cname{font-size:16px;font-weight:700;margin:3px 0 5px}
  .cmood{font-size:12.5px;color:var(--text-dim);min-height:34px}
  .fam{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;margin-top:8px}
  .fam.dark{background:#1a1f36;color:#fff}
  .fam.light{background:#eef1f8;color:#4a5168}

  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(12,16,32,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:18px;max-width:920px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  .modal img{width:100%;display:block;border-bottom:1px solid var(--border)}
  .mbody{padding:22px 26px 26px}
  .mtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mtop h2{font-size:22px;font-weight:800}
  .mmood{color:var(--text-soft);margin:8px 0 16px}
  .prompt{background:var(--surface-2);border:1px solid var(--border);border-left:4px solid var(--blue);
    border-radius:10px;padding:12px 16px;font-weight:600;color:var(--text);margin:10px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .btn{padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid var(--border-strong);background:var(--surface);color:var(--text)}
  .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  .close{position:sticky;top:0;float:right;margin:10px;background:rgba(0,0,0,.45);color:#fff;border:none;
    width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;z-index:2}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:24px 0 40px}
  @media(max-width:640px){.hero h1{font-size:24px}}
</style>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <a class="back" href="../../index.html?filter=skill">← 템플릿 허브로</a>
      <h1>Deck Design Studio: 20가지 디자인 갤러리</h1>
      <p>같은 발표 내용도 디자인 번호만 바꾸면 완전히 다른 룩으로 만들어집니다. 마음에 드는 디자인을 골라 카드를 눌러보세요.</p>
      <p style="margin-top:10px"><a href="guide.html" style="color:#fff;font-weight:700;font-size:13.5px">📖 설치·사용 안내 보기 →</a></p>
      <div class="ribbon"></div>
    </div>
  </header>

  <div class="wrap">
    <div class="toolbar">
      <button class="chip active" data-fam="all">전체</button>
      <button class="chip" data-fam="다크">다크</button>
      <button class="chip" data-fam="라이트">라이트</button>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <footer>Copilot Cowork · Deck Design Studio · 20 presentation design styles</footer>

  <div class="overlay" id="overlay">
    <div class="modal" id="modal">
      <button class="close" id="close">×</button>
      <img id="mimg" alt="">
      <div class="mbody">
        <div class="mtop"><h2 id="mname"></h2><span id="mfam" class="fam"></span></div>
        <p class="mmood" id="mmood"></p>
        <div class="prompt" id="mprompt"></div>
        <div class="actions">
          <a class="btn primary" id="mmd" target="_blank" rel="noopener">디자인 정의 보기 (SKILL.md)</a>
          <a class="btn" href="deck-design-studio.zip">전체 스킬 패키지 (ZIP)</a>
        </div>
      </div>
    </div>
  </div>

<script>
  let DATA=[], filter="all";
  const grid=document.getElementById("grid"), countEl=document.getElementById("count");
  const overlay=document.getElementById("overlay");

  function render(){
    const items=DATA.filter(d=>filter==="all"||d.family===filter);
    countEl.textContent=items.length+"개 디자인";
    grid.innerHTML=items.map(d=>`
      <article class="card" data-num="${d.num}">
        <img class="thumb" loading="lazy" src="${d.img}" alt="${d.name} 샘플">
        <div class="cbody">
          <div class="cnum">DESIGN ${d.num}</div>
          <div class="cname">${d.name}</div>
          <div class="cmood">${d.mood}</div>
          <span class="fam ${d.family==='다크'?'dark':'light'}">${d.family}</span>
        </div>
      </article>`).join("");
    grid.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openModal(c.dataset.num)));
  }
  function openModal(num){
    const d=DATA.find(x=>x.num===num); if(!d)return;
    document.getElementById("mimg").src=d.img;
    document.getElementById("mname").textContent=`${d.num}. ${d.name}`;
    const fam=document.getElementById("mfam"); fam.textContent=d.family; fam.className="fam "+(d.family==='다크'?'dark':'light');
    document.getElementById("mmood").textContent=d.mood;
    document.getElementById("mprompt").textContent=`"design ${d.num}으로 발표 덱 만들어줘. 제목은 OOO, 발표자는 OOO."`;
    document.getElementById("mmd").href=d.md;
    overlay.classList.add("open");
  }
  function closeModal(){overlay.classList.remove("open")}
  document.getElementById("close").addEventListener("click",closeModal);
  overlay.addEventListener("click",e=>{if(e.target===overlay)closeModal()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
  document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click",()=>{
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    ch.classList.add("active"); filter=ch.dataset.fam; render();
  }));

  fetch("gallery-data.json",{cache:"no-cache"}).then(r=>r.json()).then(j=>{DATA=j.items;render();})
    .catch(()=>{grid.innerHTML='<p style="color:#9aa1b0">갤러리 데이터를 불러오지 못했습니다.</p>'});
</script>
</body>
</html>
